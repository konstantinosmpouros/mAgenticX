[pytest]
testpaths = tests
python_files = test_*.py
asyncio_mode = auto
# Fail any single test that runs longer than 60s (pytest-timeout, signal method
# on POSIX) with a traceback of where it hung, instead of letting a blocking
# call — e.g. an XREAD live-tail that never sees its terminal frame — hang the
# whole CI job to the 6-hour ceiling. Unit/integration tests here finish in ms;
# 60s is pure headroom.
timeout = 60
