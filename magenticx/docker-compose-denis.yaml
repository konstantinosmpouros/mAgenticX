services:
  vectordb: # 8000
    image: chromadb/chroma:0.6.3
    container_name: vectordb
    command: ["--workers $${CHROMA_WORKERS} --host $${CHROMA_HOST_ADDR} --port $${CHROMA_HOST_PORT} --proxy-headers --log-config $${CHROMA_LOG_CONFIG} --timeout-keep-alive $${CHROMA_TIMEOUT_KEEP_ALIVE} --no-access-log"]
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - vectorstore:/chroma/chroma
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s


  rag_service: # 8001
    container_name: rag_service
    image: konstantinosmpouros/rag_service:v1.4.1
    entrypoint: ["/bin/sh", "/app/tls/entrypoint-tls.sh"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8001", "--no-server-header"]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - RAG_HOST=vectordb
      - RAG_PORT=8000
      - INTERNAL_CA_CERT_PATH=/app/tls/ca.crt
      - TRUSTED_PROXY_SECRET_FILE=/run/secrets/trusted_proxy_secret
      - LOG_FORMAT=json
      - LOG_REDACTION_SECRET_FILE=/run/secrets/log_redaction_secret
    secrets:
      - openai_api_key
      - trusted_proxy_secret
      - log_redaction_secret
    depends_on:
      - vectordb
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        monitor: 30s
        failure_action: pause
    volumes:
      - /opt/magenticx/rag_service/tls/entrypoint-tls.sh:/app/tls/entrypoint-tls.sh:ro
      - /opt/magenticx/rag_service/tls/tls.key:/app/tls/tls.key:ro
      - /opt/magenticx/rag_service/tls/tls.crt:/app/tls/tls.crt:ro
      - /opt/magenticx/rag_service/tls/ca.crt:/app/tls/ca.crt:ro
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; ctx.load_cert_chain('/app/tls/tls.crt','/app/tls/tls.key'); c=http.client.HTTPSConnection('127.0.0.1',8001,context=ctx,timeout=5); c.request('GET','/health'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s


  agents: # 8003
    container_name: agents
    image: konstantinosmpouros/agents:v1.21.11
    entrypoint: ["/usr/local/bin/load-secrets-and-exec.sh", "/bin/sh", "/app/tls/entrypoint-tls.sh"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8003", "--no-server-header"]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - RAG_BASE_URL=https://rag_service:8001
      - DIALOGUE_BRIDGE_URL=https://dialogue_bridge:8002
      - MCP_GATEWAY_URL=http://mcp_gateway:8005/sse
      - INTERNAL_CA_CERT_PATH=/app/tls/ca.crt
      - INTERNAL_CLIENT_CERT_PATH=/app/tls/tls.crt
      - INTERNAL_CLIENT_KEY_PATH=/app/tls/tls.key
      - TRUSTED_PROXY_SECRET_FILE=/run/secrets/trusted_proxy_secret
      # Both planes of the agents filesystem live on the magenticx_data volume.
      - MAGENTICX_GLOBAL_ROOT=/var/magenticx/global
      - MAGENTICX_WORKSPACES_ROOT=/var/magenticx/workspaces
      - AGENT_RUNTIME_DATABASE_URL=postgresql://admin@chat_postgres:5432/agent_runtime
      - AGENT_RUNTIME_DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - LANGGRAPH_STRICT_MSGPACK=true
      - LANGGRAPH_AES_KEY_FILE=/run/secrets/agent_runtime_aes_key
      - LOG_FORMAT=json
      - LOG_REDACTION_SECRET_FILE=/run/secrets/log_redaction_secret
    secrets:
      - openai_api_key
      - trusted_proxy_secret
      - postgres_password
      - agent_runtime_aes_key
      - log_redaction_secret
    depends_on:
      - rag_service
      - chat_postgres
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        monitor: 30s
        failure_action: pause
      resources:
        limits:
          pids: 512
    volumes:
      - /opt/magenticx/agents/tls/entrypoint-tls.sh:/app/tls/entrypoint-tls.sh:ro
      - /opt/magenticx/agents/tls/tls.key:/app/tls/tls.key:ro
      - /opt/magenticx/agents/tls/tls.crt:/app/tls/tls.crt:ro
      - /opt/magenticx/agents/tls/ca.crt:/app/tls/ca.crt:ro
      - magenticx_data:/var/magenticx
    networks:
      - backend
      - frontend
      - mcp_gateway
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; ctx.load_cert_chain('/app/tls/tls.crt','/app/tls/tls.key'); c=http.client.HTTPSConnection('127.0.0.1',8003,context=ctx,timeout=5); c.request('GET','/health'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s


  chat_postgres: # 5432
    image: pgvector/pgvector:pg16
    container_name: chat_postgres
    entrypoint: ["/bin/sh", "/var/lib/postgresql/tls/entrypoint-postgres-tls.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_DB: chat_db
    secrets:
      - postgres_password
    volumes:
      - chat_convs:/var/lib/postgresql/data
      - /opt/magenticx/postgres/tls/entrypoint-postgres-tls.sh:/var/lib/postgresql/tls/entrypoint-postgres-tls.sh:ro
      - /opt/magenticx/postgres/tls/server.key:/var/lib/postgresql/tls/server.key:ro
      - /opt/magenticx/postgres/tls/server.crt:/var/lib/postgresql/tls/server.crt:ro
      - /opt/magenticx/postgres/tls/ca.crt:/var/lib/postgresql/tls/ca.crt:ro
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "chat_db"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s


  redis: # 6379
    image: redis:7.4-alpine
    container_name: redis
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec redis-server \
          --requirepass "$$(cat /run/secrets/redis_password)" \
          --port 0 \
          --tls-port 6379 \
          --tls-cert-file /tls/tls.crt \
          --tls-key-file /tls/tls.key \
          --tls-ca-cert-file /tls/ca.crt \
          --tls-auth-clients no \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru \
          --save "" \
          --appendonly no
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    secrets:
      - redis_password
    volumes:
      - /opt/magenticx/redis/tls/tls.crt:/tls/tls.crt:ro
      - /opt/magenticx/redis/tls/tls.key:/tls/tls.key:ro
      - /opt/magenticx/redis/tls/ca.crt:/tls/ca.crt:ro
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli -h localhost --tls --cacert /tls/ca.crt ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s


  dialogue_bridge: # 8002
    container_name: dialogue_bridge
    image: konstantinosmpouros/dialogue_bridge:v2.17.14
    entrypoint: ["/bin/sh", "/app/tls/entrypoint-tls.sh"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8002", "--no-server-header"]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin@chat_postgres:5432/chat_db?ssl=verify-full
      - DATABASE_PASSWORD_FILE=/run/secrets/postgres_password
      - AGENTS_SERVICE_URL=https://agents:8003
      - SESSION_TOKEN_SECRET_FILE=/run/secrets/session_token_secret
      - TRUSTED_PROXY_SECRET_FILE=/run/secrets/trusted_proxy_secret
      - REDIS_URL=rediss://redis:6379/0
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - INTERNAL_CA_CERT_PATH=/app/tls/ca.crt
      - INTERNAL_CLIENT_CERT_PATH=/app/tls/tls.crt
      - INTERNAL_CLIENT_KEY_PATH=/app/tls/tls.key
      - LOG_FORMAT=json
      - LOG_REDACTION_SECRET_FILE=/run/secrets/log_redaction_secret
      - PARKED_TOKEN_KEY_FILE=/run/secrets/parked_token_key
      - ENTRA_TENANT_ID=ed91df0f-0bb3-4a96-9609-128c6a3630be
      - ENTRA_CLIENT_ID=621d8aca-3bda-413f-a55d-6878f6d6d998
      - ENTRA_CLIENT_SECRET_FILE=/run/secrets/entra_client_secret
      - ENTRA_REDIRECT_URI=https://agents.magenticx.com/api/v1/auth/oidc/callback
      - ENTRA_ALLOWED_GROUP_IDS=47e15454-9ad3-45e7-aa02-2241b51f6238
      # Without this the bridge runs as "development" (the default), and the
      # production-only boot checks — including refusing the dev file signer —
      # never run here.
      - APP_ENV=production
      # Session-JWT signing via OCI KMS, HSM-protected key (plan 29). There is no
      # Vault in this stack any more. These are identifiers, not secrets: the only
      # secret is the signer's API private key (the oci_signer_key Swarm secret),
      # and IAM lets that key sign with this one key only, and only from Denis's
      # reserved IP (policy DenisTokenSignerPolicy, network source DenisEgress).
      # Key: DenisSessionSigningKey (RSA-2048, HSM) in vault MpourosVault.
      - SESSION_SIGNING_BACKEND=kms
      - SESSION_SIGNING_ACTIVE_KID=100
      - SESSION_SIGNING_KEYS=100:ocid1.keyversion.oc1.uk-london-1.ervlqqtqaaalk.bwq6nk4ehriaa.abwgiljs6saf45kyhzfyvsq6uq3larztbjv6hlziecf4os4h6vjpllapuacq
      # Verify-only: every Vault Transit key version that signed in the last 20
      # days (confirm at export). Remove once 20 days have passed.
      - SESSION_SIGNING_LEGACY_KIDS=1
      - SESSION_SIGNING_PUBLIC_KEYS_DIR=/app/signing_keys
      - OCI_KMS_CRYPTO_ENDPOINT=https://ervlqqtqaaalk-crypto.kms.uk-london-1.oraclecloud.com
      - OCI_KMS_KEY_ID=ocid1.key.oc1.uk-london-1.ervlqqtqaaalk.abwgiljsqueo7f4d4srbmz7vlnukhhg4hixtsiigu2yqubyckcb5wb7muerq
      - OCI_USER_OCID=ocid1.user.oc1..aaaaaaaak35bfcuf6zzmwg5qek5hrahfddg5tvnmp2vqic75bcfccbb7v73a
      - OCI_TENANCY_OCID=ocid1.tenancy.oc1..aaaaaaaa5yydbfssu2hqq5hrm4mtrvelwhymh7se7bjgdakqhcb4ysivvyna
      - OCI_API_KEY_FINGERPRINT=e1:52:33:d4:7c:83:bb:ac:45:1f:ad:29:ee:b8:93:8f
      - OCI_REGION=uk-london-1
      - OCI_API_PRIVATE_KEY_FILE=/run/secrets/oci_signer_key
    secrets:
      - session_token_secret
      - parked_token_key
      - trusted_proxy_secret
      - redis_password
      - postgres_password
      - log_redaction_secret
      - entra_client_secret
      - oci_signer_key
    depends_on:
      - agents
      - chat_postgres
      - redis
    restart: unless-stopped
    deploy:
      update_config:
        order: start-first
        monitor: 30s
        failure_action: pause
    volumes:
      - /opt/magenticx/dialogue_bridge/tls/entrypoint-tls.sh:/app/tls/entrypoint-tls.sh:ro
      - /opt/magenticx/dialogue_bridge/tls/tls.key:/app/tls/tls.key:ro
      - /opt/magenticx/dialogue_bridge/tls/tls.crt:/app/tls/tls.crt:ro
      - /opt/magenticx/dialogue_bridge/tls/ca.crt:/app/tls/ca.crt:ro
      # Public keys only (<kid>.pem) — not secret. 100.pem from KMS, 1.pem the
      # exported Vault Transit key. Must exist before the stack is updated.
      - /opt/magenticx/dialogue_bridge/signing_keys:/app/signing_keys:ro
    networks:
      - backend
      - bridge_egress
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; ctx.load_cert_chain('/app/tls/tls.crt','/app/tls/tls.key'); c=http.client.HTTPSConnection('127.0.0.1',8002,context=ctx,timeout=5); c.request('GET','/health'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s


  agentic_ui: # 8050
    container_name: agentic_ui
    image: konstantinosmpouros/agentic_ui:v0.15.11
    entrypoint: ["/usr/local/bin/load-secrets-and-exec.sh", "/bin/sh", "/etc/nginx/tls/entrypoint-nginx-tls.sh"]
    command: ["nginx", "-g", "daemon off;"]
    security_opt:
      - no-new-privileges:true
    environment:
      - BFF_BASE_URL=https://dialogue_bridge:8002
    secrets:
      - trusted_proxy_secret
    depends_on:
      - dialogue_bridge
    restart: unless-stopped
    volumes:
      - /opt/magenticx/agentic_ui/tls/entrypoint-nginx-tls.sh:/etc/nginx/tls/entrypoint-nginx-tls.sh:ro
      - /opt/magenticx/agentic_ui/tls/tls.key:/etc/nginx/tls/tls.key:ro
      - /opt/magenticx/agentic_ui/tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - /opt/magenticx/agentic_ui/tls/ca.crt:/etc/nginx/tls/ca.crt:ro
    networks:
      - backend
      - frontend
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s




networks:
  backend:
    internal: true
  frontend:
  # dialogue_bridge's own route to the internet, and nothing else's: joining
  # `frontend` would work too, but would put the bridge on a network shared with
  # agentic_ui, agents and rag_service for no reason. Least privilege.
  bridge_egress:
    driver: overlay
  mcp_gateway:
    external: true
  proxy:
    external: true




secrets:
  openai_api_key:
    external: true
    name: magenticx_openai_api_key
  trusted_proxy_secret:
    external: true
    name: magenticx_trusted_proxy_secret
  session_token_secret:
    external: true
    name: magenticx_session_token_secret
  parked_token_key:
    external: true
    name: magenticx_parked_token_key
  redis_password:
    external: true
    name: magenticx_redis_password
  postgres_password:
    external: true
    name: magenticx_postgres_password
  agent_runtime_aes_key:
    external: true
    name: magenticx_agent_runtime_aes_key
  log_redaction_secret:
    external: true
    name: magenticx_log_redaction_secret
  entra_client_secret:
    external: true
    name: magenticx_entra_client_secret
  # API key of the OCI principal allowed only to `use keys` on the one signing
  # key, and only from Dennis (IAM network source). Plan 29 Phase B0.
  oci_signer_key:
    external: true
    name: magenticx_oci_signer_key




volumes:
  vectorstore:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/magenticx/vectorstores/chroma_db_openai

  chat_convs:

  magenticx_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/magenticx/data


