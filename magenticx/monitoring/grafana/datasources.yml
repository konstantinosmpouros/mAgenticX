# Grafana datasource provisioning — bind-mounted into the template Grafana at
# /etc/grafana/provisioning/datasources/magenticx.yml so Prometheus + Loki are
# wired automatically. If the template image already ships a Prometheus
# datasource under a different uid, you'll see a duplicate — delete the other.
apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    editable: false
