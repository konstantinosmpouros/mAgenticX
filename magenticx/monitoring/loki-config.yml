# Loki (single-binary, filesystem storage) for the Dennis monitoring stack.
# Source of truth — bind-mounted to /etc/loki/loki-config.yml.
auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: warn

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules-store
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 30d            # plan: logs 30d
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  volume_enabled: true
  allow_structured_metadata: true

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

# Log-based alerting: evaluate LogQL rules and push to the same Alertmanager
# the Prometheus rules use. Rules live at <directory>/<tenant>/; tenant is
# "fake" when auth is disabled.
ruler:
  storage:
    type: local
    local:
      directory: /etc/loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://alertmanager:9093
  enable_alertmanager_v2: true
  enable_api: true

analytics:
  reporting_enabled: false
