# Prometheus config for the Dennis monitoring stack.
# Source of truth — deployed by bind-mounting this file to
# /etc/prometheus/prometheus.yml (see docker-compose-denis-monitoring.yml).
# After editing, reload without a restart: POST http://prometheus:9090/-/reload
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  # Names the Prometheus, not a project: external labels are stamped on every
  # alert sent to Alertmanager, and this instance alerts on BOTH app stacks
  # (magenticx and orthodoxai). A `stack: magenticx` label here would mislabel
  # every OrthodoxAI alert e-mail. Per-project alerts carry their own `project`
  # label (alert.rules.yml).
  external_labels:
    monitor: dennis

rule_files:
  - /etc/prometheus/alert.rules.yml

alerting:
  alertmanagers:
    - dns_sd_configs:
        - names: ["tasks.alertmanager"]
          type: A
          port: 9093

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Per-container metrics (CPU, memory, restarts) incl. Swarm service labels.
  - job_name: cadvisor
    dns_sd_configs:
      - names: ["tasks.cadvisor"]
        type: A
        port: 8080

  # Host metrics (CPU, memory, disk, filesystem).
  - job_name: node-exporter
    dns_sd_configs:
      - names: ["tasks.node-exporter"]
        type: A
        port: 9100

  - job_name: alertmanager
    dns_sd_configs:
      - names: ["tasks.alertmanager"]
        type: A
        port: 9093

# NOTE: the app services of both stacks (magenticx bridge/agents/rag, orthodoxai
# bridge/agents) are intentionally NOT scraped here — they sit behind mTLS on
# internal networks this stack does not join, and the plan is push-OTLP, not
# scrape. cAdvisor already sees every container on the host.
# Application error/latency alerts arrive in Track 2 (OTel SDK → otel-collector).
