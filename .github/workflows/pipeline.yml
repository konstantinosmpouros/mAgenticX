name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # ===========================================================================
  # CI stage
  # ===========================================================================

  # One job per backend service: install only that service's deps, run only its
  # tests, and report coverage scoped to its own source tree.
  backend:
    name: ci / ${{ matrix.service }}
    runs-on: ubuntu-latest
    # Hard backstop above the normal run time (~2-4 min) so a hang that slips
    # past the per-test pytest-timeout can never pin the runner for hours.
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: dialogue_bridge
            tests: tests/dialogue_bridge tests/integration
          - service: agents
            tests: tests/agents
          - service: rag_service
            tests: tests/rag_service
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            src/${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt
          python -m pip install -r src/${{ matrix.service }}/requirements.txt

      - name: Run tests with coverage
        run: >-
          python -m pytest ${{ matrix.tests }}
          --cov=src/${{ matrix.service }}
          --cov-report=term-missing
          --cov-report=xml:coverage-${{ matrix.service }}.xml

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.service }}
          path: coverage-${{ matrix.service }}.xml
          if-no-files-found: ignore

  # Frontend service: lint + build, plus the Python static-contract checks that
  # guard the frontend↔bridge API contract. Coverage is N/A (no JS test runner).
  agentic_ui:
    name: ci / agentic_ui
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: src/agentic_ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: src/agentic_ui
        run: npm ci

      - name: Lint frontend
        working-directory: src/agentic_ui
        run: npm run lint

      - name: Build frontend
        working-directory: src/agentic_ui
        run: npm run build

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r tests/requirements.txt

      - name: Run frontend contract tests
        run: python -m pytest tests/agentic_ui -q

  # ===========================================================================
  # CD stage — PLACEHOLDER, not yet implemented.
  #
  # Deployment is currently manual (see CLAUDE.md § Deployment): images are
  # built locally with `docker buildx --platform linux/arm64`, pushed to Docker
  # Hub, and the Swarm stack is redeployed by hand from Portainer. This job only
  # establishes the pipeline shape so the CD stage has a home; wire the real
  # steps once the automated deploy path is decided.
  #
  # Intended future steps:
  #   - docker buildx build --platform linux/arm64 -t <repo>/<svc>:<tag> --push
  #   - trigger the Portainer stack redeploy (webhook) for magenticx
  # ===========================================================================
  deploy:
    name: cd / deploy (not yet implemented)
    needs: [backend, agentic_ui]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: CD placeholder
        run: |
          echo "CI passed on main — CD stage reached."
          echo "CD is not yet implemented: deploy is manual today"
          echo "(buildx --platform linux/arm64 -> Docker Hub -> Portainer redeploy)."
