name: CI/CD

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  # CI — one job: a step per service's tests, then a step per service's image.
  # Details: docs/architecture/deployment.md
  #   images publish: push to main that changed docker-compose-denis.yaml, or Run workflow
  #   images check:   pull request that changes it — build + scan only, nothing pushed
  ci:
    name: ci
    runs-on: ubuntu-24.04-arm # Dennis is ARM64: images build natively, no QEMU
    timeout-minutes: 120
    # One run per branch at a time, so two releases never build the same tag
    # at once; a PR's run is superseded by the PR's next push.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    permissions:
      contents: read
      packages: write
    env:
      RELEASE_MODE: ${{ github.event_name == 'pull_request' && 'check' || 'publish' }}
      COMPOSE_FILE: magenticx/docker-compose-denis.yaml
      TRIVY_IMAGE: ghcr.io/aquasecurity/trivy:0.75.0@sha256:af6acf9a6b85dfe389a1941505c0ce9efef52a4719635e1a962f022a3d855daa
    outputs:
      deploy: ${{ steps.release.outputs.deploy }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the release diff below

      # A change to docker-compose-denis.yaml is a release. Diffed with git:
      # Actions' push payload has no file lists.
      #   images: build the new tags (publish, or check for a PR) — main or a PR only
      #   deploy: images were published, so `cd` runs
      - name: Is this a release? (docker-compose-denis.yaml changed)
        id: release
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case "$EVENT" in
            workflow_dispatch) release=true ;;
            push) base="$PUSH_BEFORE" ;;
            pull_request) base="$PR_BASE" ;;
            *) release=false ;;
          esac
          if [ -z "${release:-}" ]; then
            if [ -z "$base" ] || ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
              release=true # no usable base: can't tell, so don't skip a release
            elif git diff --quiet "$base" "$GITHUB_SHA" -- "$COMPOSE_FILE"; then
              release=false
            else
              release=true
            fi
          fi
          images=false; deploy=false
          if [ "$release" = true ]; then
            if [ "$EVENT" = pull_request ]; then images=true
            elif [ "$REF" = refs/heads/main ]; then images=true; deploy=true
            fi
          fi
          { echo "release=$release"; echo "images=$images"; echo "deploy=$deploy"; } | tee -a "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            tests/requirements.txt
            magenticx/dialogue_bridge/requirements.txt
            magenticx/agents/requirements.txt
            magenticx/rag_service/requirements.txt

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: magenticx/agentic_ui/package-lock.json

      # Each service gets its own venv so their pins can't mask each other.
      # `!cancelled()` runs every service even if an earlier one failed.

      - name: dialogue_bridge — install + test
        if: ${{ !cancelled() }}
        run: |
          python -m venv .venv/dialogue_bridge
          .venv/dialogue_bridge/bin/python -m pip install --upgrade pip
          .venv/dialogue_bridge/bin/python -m pip install -r tests/requirements.txt -r magenticx/dialogue_bridge/requirements.txt
          .venv/dialogue_bridge/bin/python -m pytest tests/dialogue_bridge tests/integration \
            --cov=magenticx/dialogue_bridge --cov-report=term-missing \
            --cov-report=xml:coverage-dialogue_bridge.xml

      - name: agents — install + test
        if: ${{ !cancelled() }}
        run: |
          python -m venv .venv/agents
          .venv/agents/bin/python -m pip install --upgrade pip
          .venv/agents/bin/python -m pip install -r tests/requirements.txt -r magenticx/agents/requirements.txt
          .venv/agents/bin/python -m pytest tests/agents \
            --cov=magenticx/agents --cov-report=term-missing \
            --cov-report=xml:coverage-agents.xml

      - name: rag_service — install + test
        if: ${{ !cancelled() }}
        run: |
          python -m venv .venv/rag_service
          .venv/rag_service/bin/python -m pip install --upgrade pip
          .venv/rag_service/bin/python -m pip install -r tests/requirements.txt -r magenticx/rag_service/requirements.txt
          .venv/rag_service/bin/python -m pytest tests/rag_service \
            --cov=magenticx/rag_service --cov-report=term-missing \
            --cov-report=xml:coverage-rag_service.xml

      - name: agentic_ui — install
        id: ui_install
        if: ${{ !cancelled() }}
        working-directory: magenticx/agentic_ui
        run: npm ci

      # Fails above the warning count pinned in package.json (only ever lower it).
      - name: agentic_ui — lint (warning ceiling)
        if: ${{ !cancelled() && steps.ui_install.outcome == 'success' }}
        working-directory: magenticx/agentic_ui
        run: npm run lint:ceiling

      # `vite build` doesn't type-check, so this is the only type gate.
      - name: agentic_ui — type-check
        if: ${{ !cancelled() && steps.ui_install.outcome == 'success' }}
        working-directory: magenticx/agentic_ui
        run: npm run typecheck

      - name: agentic_ui — test
        if: ${{ !cancelled() && steps.ui_install.outcome == 'success' }}
        working-directory: magenticx/agentic_ui
        run: npm run test

      - name: agentic_ui — build
        if: ${{ !cancelled() && steps.ui_install.outcome == 'success' }}
        working-directory: magenticx/agentic_ui
        run: npm run build

      - name: agentic_ui — contract tests
        if: ${{ !cancelled() }}
        run: |
          python -m venv .venv/contracts
          .venv/contracts/bin/python -m pip install -r tests/requirements.txt
          .venv/contracts/bin/python -m pytest tests/agentic_ui -q

      - name: Upload coverage reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage-*.xml
          if-no-files-found: ignore

      # --- images: a step per service ------------------------------------------
      # Only after every test above is green (no `!cancelled()` here). Builds +
      # scans each new tag; pushes only in publish mode. Any failure fails `ci`,
      # and `cd` needs `ci`, so a half-built release never deploys.

      # Fail closed: only the repository owner can ship to production.
      - name: Only the repository owner can release
        if: steps.release.outputs.images == 'true' && env.RELEASE_MODE == 'publish'
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Releases are started by $OWNER only (this run was started by $ACTOR)."
            exit 1
          fi

      - name: Log in to GHCR
        if: steps.release.outputs.images == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: dialogue_bridge — build, scan, push image
        if: steps.release.outputs.images == 'true'
        run: bash .github/scripts/release_image.sh dialogue_bridge

      - name: agents — build, scan, push image
        if: steps.release.outputs.images == 'true'
        run: bash .github/scripts/release_image.sh agents

      - name: rag_service — build, scan, push image
        if: steps.release.outputs.images == 'true'
        run: bash .github/scripts/release_image.sh rag_service

      - name: agentic_ui — build, scan, push image
        if: steps.release.outputs.images == 'true'
        run: bash .github/scripts/release_image.sh agentic_ui

      # An anonymous pull must be refused — fails the release if any image is public.
      - name: Verify every image is private
        if: steps.release.outputs.images == 'true' && env.RELEASE_MODE == 'publish'
        run: |
          anon=$(mktemp -d)
          failed=0
          for svc in dialogue_bridge agents rag_service agentic_ui; do
            image=$(grep -oE "ghcr\.io/[^/]+/magenticx_$svc:v[0-9]+\.[0-9]+\.[0-9]+" "$COMPOSE_FILE")
            if out=$(DOCKER_CONFIG="$anon" docker manifest inspect "$image" 2>&1); then
              echo "::error::$image can be pulled WITHOUT credentials — it is PUBLIC. Make it private: github.com/users/$GITHUB_REPOSITORY_OWNER/packages/container/magenticx_$svc/settings → Danger Zone → Change visibility."
              failed=1
            elif printf '%s' "$out" | grep -qiE "unauthorized|denied|authentication required"; then
              echo "$image: private ✓"
            else
              echo "::error::Could not verify $image is private: $out"
              failed=1
            fi
          done
          rm -rf "$anon"
          exit "$failed"

  # CD — deploys the images `ci` published; builds nothing.
  # Only after a publish (never for a pull request's check).
  cd:
    name: cd
    needs: [ci]
    if: needs.ci.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      SITE: https://agents.magenticx.com
      COMPOSE_FILE: magenticx/docker-compose-denis.yaml
    steps:
      - name: Checkout code
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      # Fail closed: only the repository owner can ship to production.
      - name: Only the repository owner can deploy
        env:
          ACTOR: ${{ github.triggering_actor }}
          OWNER: ${{ github.repository_owner }}
        run: |
          if [ "$ACTOR" != "$OWNER" ]; then
            echo "::error::Deploys are started by $OWNER only (this run was started by $ACTOR)."
            exit 1
          fi

      # Portainer pulls main and redeploys. Safe to retry.
      - name: Tell Portainer to pull main and redeploy the stack
        env:
          WEBHOOK_URL: ${{ secrets.PORTAINER_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::error::PORTAINER_WEBHOOK_URL is not set (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi
          curl -fsS --max-time 60 --retry 3 --retry-all-errors -X POST -o /dev/null "$WEBHOOK_URL"

      # Wait until the public site reports the new bridge + UI versions.
      - name: Wait for the release to go live
        run: |
          tag_of() {
            grep -E "^[[:space:]]+image:[[:space:]]+ghcr\.io/[^/]+/magenticx_$1:" "$COMPOSE_FILE" \
              | sed -E 's/.*:(v[0-9]+\.[0-9]+\.[0-9]+)[[:space:]]*$/\1/'
          }
          want_bridge=$(tag_of dialogue_bridge)
          want_ui=$(tag_of agentic_ui)
          deadline=$((SECONDS + 900))
          while :; do
            bridge=$(curl -fsS --max-time 10 "$SITE/api/health" \
              | python3 -c 'import json, sys; print(json.load(sys.stdin).get("version", ""))' 2>/dev/null || true)
            ui=$(curl -fsS --max-time 10 "$SITE/version.txt?t=$(date +%s)" | tr -d '[:space:]' || true)
            if [ "$bridge" = "$want_bridge" ] && [ "$ui" = "$want_ui" ]; then
              echo "Live: dialogue_bridge $bridge, agentic_ui $ui"
              exit 0
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Not live after 15 min (bridge '${bridge:-none}', want $want_bridge; ui '${ui:-none}', want $want_ui). Check the stack in Portainer — a failed update rolls itself back."
              exit 1
            fi
            echo "Waiting: bridge ${bridge:-none}/$want_bridge, ui ${ui:0:20}/$want_ui"
            sleep 20
          done
