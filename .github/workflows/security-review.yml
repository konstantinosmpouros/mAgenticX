name: Claude Security Review

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: claude-security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security-review:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Claude security review
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.MAGENTICX_GITHUB_TOKEN }}
          display_report: "true"
          prompt: |
            Perform a focused security review of this repository change.

            Scope:
            - If this workflow was triggered by a pull request, review the PR diff in context.
            - If this workflow was triggered by a push, review the commit/push changes in context.

            Focus on:
            - auth/authz flaws
            - secrets exposure
            - injection risks
            - SSRF
            - unsafe deserialization
            - file upload risks
            - insecure shell execution
            - sensitive data leakage
            - obvious dependency/supply-chain risk introduced by the change

            Output requirements:
            - Give a concise security report
            - Group findings by severity: Critical / High / Medium / Low
            - For each finding include:
              - title
              - impacted file(s)
              - why it is a vulnerability
              - concrete remediation
            - If no meaningful issues are found, say so explicitly.