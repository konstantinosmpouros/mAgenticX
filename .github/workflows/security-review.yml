name: Security Review

permissions:
  pull-requests: write
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Claude security review
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-opus-4-5-20251101
          comment-pr: true
          upload-results: true
          claudecode-timeout: 20
          exclude-directories: 'node_modules,dist,build,.next,vendor,notebooks,docs,data,public,tls'
          custom-security-scan-instructions: .github/claude/security-instructions.md
          # false-positive-filtering-instructions: .github/claude/fp-filter.md