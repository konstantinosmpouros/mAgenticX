name: Security Review

permissions:
  pull-requests: write
  contents: read
  id-token: write

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      # Checkout the code to analyze the changes in the pull request
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Claude security review for PR
        if: github.event_name == 'pull_request'
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude-model: claude-sonnet-4-5-20250929
          comment-pr: true
          upload-results: true
          claudecode-timeout: 25
          exclude-directories: 'node_modules,dist,build,.next,vendor,notebooks,docs,data,public,tls,vectorstores,__pycache__,.venv,.env,'
          custom-security-scan-instructions: .github/claude/security-instructions.md
          # false-positive-filtering-instructions: .github/claude/fp-filter.md

      - name: Claude security review for workflow dispatch
        if: github.event_name != 'pull_request'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            EVENT: ${{ github.event_name }}
            SHA: ${{ github.sha }}

            Read `.github/claude/security-instructions.md` and follow it exactly, with one adjustment:
            there is no pull request context for this run.

            Scope:
            - Review the currently checked out repository snapshot at this commit
            - Focus only on high-confidence, actionable security findings
            - Do not attempt PR commenting or PR-specific operations

            Output requirements:
            - Produce a single markdown security report
            - Write that report to `security-report.md` in the workspace root
            - If there are no findings, still write a concise markdown report stating that no high-confidence security findings were identified

            Note:
            - Your final reply must be only the markdown report text
          claude_args: |
            --model "claude-sonnet-4-5-20250929"
            --allowedTools "Read,Glob,Grep,LS,Task,Write,Edit,MultiEdit,Bash(git diff:*),Bash(git status:*),Bash(git log:*),Bash(git show:*),Bash(git remote show:*)"

      - name: Ensure security report artifact exists
        if: always()
        run: |
          if [ ! -f security-report.md ]; then
            {
              echo "# Security Review"
              echo
              echo "No \`security-report.md\` file was produced by the Claude security review step."
              echo
              echo "Context:"
              echo "- Event: \`${{ github.event_name }}\`"
              echo "- Repository: \`${{ github.repository }}\`"
              echo "- SHA: \`${{ github.sha }}\`"
              echo "- PR number: \`${{ github.event.pull_request.number || 'n/a' }}\`"
              echo
              echo "Possible reasons:"
              echo "- The run was started with \`workflow_dispatch\` and has no PR context."
              echo "- The security review action completed without writing a workspace report file."
              echo "- The action hit an internal error or a tool permission denial before report generation."
            } > security-report.md
          fi

      - name: Upload security report as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-review-results
          path: security-report.md
          retention-days: 90
          if-no-files-found: error
