name: Security Review

permissions:
  pull-requests: write   # Needs to post comments on PRs
  contents: read

on:
  # Run on pull request events to catch issues early in the review process
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

  # Run on pushes to main, develop, and release branches to catch any issues before they hit production
  push:
    branches:
      - main
      - develop
      - 'release/**'

  # Bonus: manual trigger from the Actions tab
  workflow_dispatch:

jobs:
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Run Claude Security Review
        uses: anthropics/claude-code-security-review@main
        with:
          claude-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          comment-pr: true
          upload-results: true

          # What model to use (default is claude-opus-4-5-20251101)
          claude-model: claude-opus-4-5-20251101

          # Timeout in minutes
          claudecode-timeout: 20

          # Directories to exclude from the scan (comma-separated)
          exclude-directories: 'node_modules,dist,build,.next,vendor,notebooks,docs,data,public,tls'

          # Custom instructions for the security scan (optional)
          custom-security-scan-instructions: .github/claude/security-instructions.md

          # False-positive filtering tuning (optional)
          # false-positive-filtering-instructions: .github/fp-filter.md
