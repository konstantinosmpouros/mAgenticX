name: Security Snyk

on:

  workflow_dispatch:

permissions:
  contents: read

jobs:
  snyk:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      actions: read

    env:
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Snyk CLI
        uses: snyk/actions/setup@806182742461562b67788a64410098c9d9b96adb


      # ---------- SNYK CODE (SAST) ----------
      # Keep pipeline alive even when code issues are found (exit code 1)
      - name: Snyk Code test (SARIF)
        run: snyk code test --sarif > snyk-code.sarif || true
        continue-on-error: true

      - name: Upload Snyk Code SARIF to GitHub Code Scanning
        if: ${{ hashFiles('snyk-code.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: snyk-code.sarif


      # ---------- OPEN SOURCE (SCA) ----------
      # Node project
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        working-directory: src/agentic_ui
        run: npm ci

      - name: Snyk monitor - Node UI
        run: snyk monitor --file=src/agentic_ui/package-lock.json --project-name=agentic_ui

      # Python projects
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r src/agents/requirements.txt
          pip install -r src/dialogue_bridge/requirements.txt
          pip install -r src/rag_service/requirements.txt

      - name: Snyk monitor - agents requirements
        run: snyk monitor --file=src/agents/requirements.txt --package-manager=pip --project-name=agents

      - name: Snyk monitor - dialogue_bridge requirements
        run: snyk monitor --file=src/dialogue_bridge/requirements.txt --package-manager=pip --project-name=dialogue_bridge

      - name: Snyk monitor - rag_service requirements
        run: snyk monitor --file=src/rag_service/requirements.txt --package-manager=pip --project-name=rag_service


      # ---------- IaC ----------
      - name: Snyk IaC test and report
        run: snyk iac test --report
        continue-on-error: true


      # ---------- CONTAINER ----------
      - name: Build agents image
        run: docker build -t magenticx/agents:ci -f src/agents/Dockerfile src/agents

      - name: Build dialogue_bridge image
        run: docker build -t magenticx/dialogue_bridge:ci -f src/dialogue_bridge/Dockerfile src/dialogue_bridge

      - name: Build rag_service image
        run: docker build -t magenticx/rag_service:ci -f src/rag_service/Dockerfile src/rag_service

      - name: Build agentic_ui image
        run: docker build -t magenticx/agentic_ui:ci -f src/agentic_ui/Dockerfile src/agentic_ui

      - name: Snyk container monitor - agents
        run: snyk container monitor magenticx/agents:ci --file=src/agents/Dockerfile

      - name: Snyk container monitor - dialogue_bridge
        run: snyk container monitor magenticx/dialogue_bridge:ci --file=src/dialogue_bridge/Dockerfile

      - name: Snyk container monitor - rag_service
        run: snyk container monitor magenticx/rag_service:ci --file=src/rag_service/Dockerfile

      - name: Snyk container monitor - agentic_ui
        run: snyk container monitor magenticx/agentic_ui:ci --file=src/agentic_ui/Dockerfile