version: "3.8"

services:
  grafana:
    image: portainer/template-swarm-monitoring:grafana-9.5.2
    # No host port — Grafana is reachable ONLY through NPM over the `proxy`
    # network (monitoring.magenticx.com). Publishing :3000 would expose it on the
    # VM's IP in plaintext, bypassing NPM's HTTPS + access control.
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: grafana-data
        target: /var/lib/grafana
      - type: bind
        source: /opt/magenticx/monitoring/grafana/datasources.yml
        target: /etc/grafana/provisioning/datasources/magenticx.yml
        read_only: true
      - type: bind
        source: /opt/magenticx/monitoring/grafana/tls/tls.crt
        target: /etc/grafana/tls/tls.crt
        read_only: true
      - type: bind
        source: /opt/magenticx/monitoring/grafana/tls/tls.key
        target: /etc/grafana/tls/tls.key
        read_only: true
      - type: bind
        source: /opt/magenticx/monitoring/grafana/dashboards.yml
        target: /etc/grafana/provisioning/dashboards/magenticx.yml
        read_only: true
      - type: bind
        source: /opt/magenticx/monitoring/grafana/dashboards
        target: /etc/grafana/dashboards
        read_only: true
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER}
      - GF_SECURITY_ADMIN_PASSWORD__FILE=/run/secrets/grafana_admin_password
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_PROTOCOL=https
      - GF_SERVER_CERT_FILE=/etc/grafana/tls/tls.crt
      - GF_SERVER_CERT_KEY=/etc/grafana/tls/tls.key
      - GF_SERVER_ROOT_URL=https://monitoring.magenticx.com
    secrets:
      - grafana_admin_password
    networks:
      - net
      - proxy

  prometheus:
    image: portainer/template-swarm-monitoring:prometheus-v2.44.0
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--log.level=error'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--storage.tsdb.retention.size=8GB'
      - '--web.enable-lifecycle'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: prometheus-data
        target: /prometheus
      - type: bind
        source: /opt/magenticx/monitoring/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        read_only: true
      - type: bind
        source: /opt/magenticx/monitoring/alert.rules.yml
        target: /etc/prometheus/alert.rules.yml
        read_only: true
    networks:
      - net

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.47.0
    command: -logtostderr -docker_only
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /var/run
        target: /var/run
        read_only: true
      - type: bind
        source: /sys
        target: /sys
        read_only: true
      - type: bind
        source: /var/lib/docker
        target: /var/lib/docker
        read_only: true
      - type: bind
        source: /dev/disk
        target: /dev/disk
        read_only: true
    networks:
      - net

  node-exporter:
    image: prom/node-exporter:v1.5.0
    command:
      - '--path.sysfs=/host/sys'
      - '--path.procfs=/host/proc'
      - '--collector.filesystem.ignored-mount-points=^/(sys|proc|dev|host|etc)($$|/)'
      - '--no-collector.ipvs'
    deploy:
      mode: global
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    volumes:
      - type: bind
        source: /
        target: /rootfs
        read_only: true
      - type: bind
        source: /proc
        target: /host/proc
        read_only: true
      - type: bind
        source: /sys
        target: /host/sys
        read_only: true
    networks:
      - net

  alertmanager:
    image: prom/alertmanager:v0.27.0
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
      - '--log.level=warn'
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    secrets:
      - alert_smtp_password
    volumes:
      - type: volume
        source: alertmanager-data
        target: /alertmanager
      - type: bind
        source: /opt/magenticx/monitoring/alertmanager.yml
        target: /etc/alertmanager/alertmanager.yml
        read_only: true
    networks:
      - net

  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/loki-config.yml"]
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure
      placement:
        constraints:
          - node.role == manager
    volumes:
      - type: volume
        source: loki-data
        target: /loki
      - type: bind
        source: /opt/magenticx/monitoring/loki-config.yml
        target: /etc/loki/loki-config.yml
        read_only: true
      - type: bind
        source: /opt/magenticx/monitoring/loki-rules.yml
        target: /etc/loki/rules/fake/rules.yml
        read_only: true
    networks:
      - net

  alloy:
    image: grafana/alloy:v1.4.2
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy/data
    user: root
    deploy:
      mode: global
    volumes:
      - type: bind
        source: /opt/magenticx/monitoring/alloy-config.alloy
        target: /etc/alloy/config.alloy
        read_only: true
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
      - type: volume
        source: alloy-data
        target: /var/lib/alloy/data
    networks:
      - net

volumes:
  grafana-data:
  prometheus-data:
  alertmanager-data:
  loki-data:
  alloy-data:

networks:
  net:
    driver: overlay
  proxy:
    external: True

secrets:
  alert_smtp_password:
    external: true
    name: magenticx_alert_smtp_password
  grafana_admin_password:
    external: true
    name: magenticx_grafana_admin_password
