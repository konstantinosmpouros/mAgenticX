services:
  vault: # 8004
    image: hashicorp/vault:1.21
    container_name: vault
    cap_add: ["IPC_LOCK"]
    user: "100:100"
    environment:
      SKIP_SETCAP: "true"
      VAULT_LOCAL_CONFIG: |
        {
          "ui": true,
          "log_level": "info",
          "disable_mlock": true,
          "storage": { "raft": { "path": "/vault/data", "node_id": "vault-node-1" } },
          "listener": [
            {
              "tcp": {
                "address": "0.0.0.0:8004",
                "cluster_address": "0.0.0.0:8005",
                "tls_disable": false,
                "tls_cert_file": "/vault/tls/tls.crt",
                "tls_key_file": "/vault/tls/tls.key",
                "tls_client_ca_file": "/vault/tls/ca.crt"
              }
            }
          ],
          "api_addr": "https://vault:8004",
          "cluster_addr": "https://vault:8005"
        }
    command: ["server"]
    volumes:
      - data:/vault/data
      - /opt/vault/tls/tls.key:/vault/tls/tls.key:ro
      - /opt/vault/tls/tls.crt:/vault/tls/tls.crt:ro
      - /opt/vault/tls/ca.crt:/vault/tls/ca.crt:ro
    restart: unless-stopped
    networks:
      - vault
      - proxy

volumes:
  data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/vault/data

networks:
  vault:
  proxy:
    external: true


