name: magenticx

services:

  vectordb: # 8000
    image: chromadb/chroma:0.6.3
    container_name: vectordb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - vectorstore:/chroma/chroma
    restart: unless-stopped
    networks:
      - backend


  rag_service: # 8001
    container_name: rag_service
    image: rag_service
    build:
      context: ./rag_service
      dockerfile: Dockerfile
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_HOST=vectordb
      - RAG_PORT=8000
      - TRUSTED_PROXY_SECRET=${TRUSTED_PROXY_SECRET}
    depends_on:
      - vectordb
    restart: unless-stopped
    networks:
      - backend
      - frontend


  agents: # 8003
    container_name: agents
    image: agents
    build:
      context: ./agents
      dockerfile: Dockerfile
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    # The service needs no Linux capabilities (non-root uvicorn + file IO on
    # its own volumes) — drop them all, and cap the process count so a runaway
    # agent loop can't fork-storm the host.
    cap_drop:
      - ALL
    pids_limit: 512
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_BASE_URL=http://rag_service:8001
      # Reverse hop for the memory-search tool (agent → bridge). HTTP in local
      # dev (the bridge serves plaintext here); prod uses https (see denis compose).
      - DIALOGUE_BRIDGE_URL=http://dialogue_bridge:8002
      - MCP_GATEWAY_URL=http://mcp_gateway:8005/sse
      - TRUSTED_PROXY_SECRET=${TRUSTED_PROXY_SECRET}
      # Both planes of the agents filesystem live on the magenticx_data volume.
      - MAGENTICX_GLOBAL_ROOT=/var/magenticx/global
      - MAGENTICX_WORKSPACES_ROOT=/var/magenticx/workspaces
      # Durable LangGraph checkpointer — separate DB on the same Postgres
      # instance. Dev is plaintext (no TLS, no encryption); prod wires TLS +
      # an AES key (see docker-compose-denis.yaml).
      - AGENT_RUNTIME_DATABASE_URL=postgresql://admin:admin@chat_postgres:5432/agent_runtime
      - LANGGRAPH_STRICT_MSGPACK=true
    volumes:
      # The whole agents filesystem: global plane (agent definitions + skills
      # catalogue) and one workspace per user (pool, custom agents, per-agent
      # memory, tool prefs, conversation files). See runtime/filesystem/layout.py.
      - magenticx_data:/var/magenticx
    depends_on:
      - rag_service
      - chat_postgres
    restart: unless-stopped
    ports:
      - "8003:8003"
    networks:
      - backend
      - frontend
      - mcp_net


  chat_postgres: # 5432
    image: pgvector/pgvector:pg16  # Postgres 16 + pgvector (per-conversation message embeddings)
    container_name: chat_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chat_db
    volumes:
      - chat_convs:/var/lib/postgresql/data
    restart: unless-stopped
    ports:
      - "5432:5432"
    networks:
      - backend
      - frontend


  redis: # 6379
    image: redis:7.4-alpine
    container_name: redis
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:-magenticx-dev-redis}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped
    networks:
      - backend


  dialogue_bridge: # 8002
    container_name: dialogue_bridge
    image: dialogue_bridge
    build:
      context: ./dialogue_bridge
      dockerfile: Dockerfile
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:admin@chat_postgres:5432/chat_db
      - VAULT_URL=http://vault:8004
      - VAULT_ROLE_ID=${VAULT_ROLE_ID:-}
      - VAULT_SECRET_ID=${VAULT_SECRET_ID:-}
      - AGENTS_SERVICE_URL=http://agents:8003
      - SESSION_TOKEN_SECRET=${SESSION_TOKEN_SECRET}
      - TRUSTED_PROXY_SECRET=${TRUSTED_PROXY_SECRET}
      - REDIS_URL=redis://redis:6379/0
      - REDIS_PASSWORD=${REDIS_PASSWORD:-magenticx-dev-redis}
      # Microsoft Entra ID (OIDC) sign-in — inert unless all three of
      # tenant/client/secret are set (SSO stays off when these are empty).
      - ENTRA_TENANT_ID=${ENTRA_TENANT_ID:-}
      - ENTRA_CLIENT_ID=${ENTRA_CLIENT_ID:-}
      - ENTRA_CLIENT_SECRET=${ENTRA_CLIENT_SECRET:-}
      - ENTRA_REDIRECT_URI=${ENTRA_REDIRECT_URI:-}
      - ENTRA_ALLOWED_GROUP_IDS=${ENTRA_ALLOWED_GROUP_IDS:-}
    depends_on:
      - agents
      - chat_postgres
      - redis
    restart: unless-stopped
    ports:
      - "8002:8002"
    networks:
      - backend
      - frontend
      - hashicorp_vault


  agentic_ui: # 8050
    image: agentic_ui
    container_name: agentic_ui
    build:
      context: ./agentic_ui
      dockerfile: Dockerfile
    security_opt:
      - no-new-privileges:true
    environment:
      - BFF_BASE_URL=http://dialogue_bridge:8002
      - TRUSTED_PROXY_SECRET=${TRUSTED_PROXY_SECRET}
    depends_on: 
      - dialogue_bridge
    ports:
      - "8050:80"
    restart: unless-stopped
    networks: 
      - backend
      - frontend



networks:
  backend:
    internal: true
  frontend:
  hashicorp_vault:
    external: true
  mcp_net:
    external: true



volumes:
  vectorstore:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./vectorstores/chroma_db_openai

  chat_convs:

  magenticx_data:
