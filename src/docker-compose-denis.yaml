services:
  vectordb: # 8000
    image: chromadb/chroma:0.6.3
    container_name: vectordb
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/heartbeat', timeout=5)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - vectorstore:/chroma/chroma
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  rag_service: # 8001
    container_name: rag_service
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; c=http.client.HTTPSConnection('127.0.0.1',8001,context=ctx,timeout=5); c.request('GET','/'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    image: konstantinosmpouros/rag_service:v1.2.5
    entrypoint: ["/bin/sh", "/app/tls/entrypoint-tls.sh"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8001"]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - RAG_HOST=vectordb
      - RAG_PORT=8000
      - INTERNAL_CA_CERT_PATH=/app/tls/ca.crt
      - TRUSTED_PROXY_SECRET_FILE=/run/secrets/trusted_proxy_secret
    secrets:
      - openai_api_key
      - trusted_proxy_secret
    depends_on:
      - vectordb
    restart: unless-stopped
    volumes:
      - /opt/magenticx/rag_service/tls/entrypoint-tls.sh:/app/tls/entrypoint-tls.sh:ro
      - /opt/magenticx/rag_service/tls/tls.key:/app/tls/tls.key:ro
      - /opt/magenticx/rag_service/tls/tls.crt:/app/tls/tls.crt:ro
      - /opt/magenticx/rag_service/tls/ca.crt:/app/tls/ca.crt:ro
    networks:
      - backend
      - frontend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  agents: # 8003
    container_name: agents
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; c=http.client.HTTPSConnection('127.0.0.1',8003,context=ctx,timeout=5); c.request('GET','/'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    image: konstantinosmpouros/agents:v1.15.0
    entrypoint: ["/usr/local/bin/load-secrets-and-exec.sh", "/bin/sh", "/app/tls/entrypoint-tls.sh"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8003"]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - OPENAI_API_KEY_FILE=/run/secrets/openai_api_key
      - RAG_BASE_URL=https://rag_service:8001
      - MCP_GATEWAY_URL=http://mcp_gateway:8005/sse
      - INTERNAL_CA_CERT_PATH=/app/tls/ca.crt
      - TRUSTED_PROXY_SECRET_FILE=/run/secrets/trusted_proxy_secret
      - AGENTS_FILESYSTEM_ROOT=/var/agents/filesystem
      - SKILLS_REGISTRY_GLOBAL_ROOT=/var/agents/skills_registry/global
      - SKILLS_REGISTRY_USERS_ROOT=/var/agents/skills_registry/users
    secrets:
      - openai_api_key
      - trusted_proxy_secret
    depends_on:
      - rag_service
    restart: unless-stopped
    volumes:
      - /opt/magenticx/agents/tls/entrypoint-tls.sh:/app/tls/entrypoint-tls.sh:ro
      - /opt/magenticx/agents/tls/tls.key:/app/tls/tls.key:ro
      - /opt/magenticx/agents/tls/tls.crt:/app/tls/tls.crt:ro
      - /opt/magenticx/agents/tls/ca.crt:/app/tls/ca.crt:ro
      - agents_filesystem:/var/agents/filesystem
      - skills_registry_global:/var/agents/skills_registry/global
      - skills_registry_users:/var/agents/skills_registry/users
    networks:
      - backend
      - frontend
      - mcp_gateway
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


  chat_postgres: # 5432
    image: postgres:16.3
    container_name: chat_postgres
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "admin", "-d", "chat_db"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    entrypoint: ["/bin/sh", "/var/lib/postgresql/tls/entrypoint-postgres-tls.sh"]
    command: ["postgres"]
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chat_db
    volumes:
      - chat_convs:/var/lib/postgresql/data
      - /opt/magenticx/postgres/tls/entrypoint-postgres-tls.sh:/var/lib/postgresql/tls/entrypoint-postgres-tls.sh:ro
      - /opt/magenticx/postgres/tls/server.key:/var/lib/postgresql/tls/server.key:ro
      - /opt/magenticx/postgres/tls/server.crt:/var/lib/postgresql/tls/server.crt:ro
      - /opt/magenticx/postgres/tls/ca.crt:/var/lib/postgresql/tls/ca.crt:ro
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  redis: # 6379
    image: redis:7.4-alpine
    container_name: redis
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$$(cat /run/secrets/redis_password) redis-cli -h localhost --tls --cacert /tls/ca.crt ping | grep -q PONG"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        exec redis-server \
          --requirepass "$$(cat /run/secrets/redis_password)" \
          --port 0 \
          --tls-port 6379 \
          --tls-cert-file /tls/tls.crt \
          --tls-key-file /tls/tls.key \
          --tls-ca-cert-file /tls/ca.crt \
          --tls-auth-clients no \
          --maxmemory 256mb \
          --maxmemory-policy allkeys-lru \
          --save "" \
          --appendonly no
    user: "999:999"
    security_opt:
      - no-new-privileges:true
    secrets:
      - redis_password
    volumes:
      - /opt/magenticx/redis/tls/tls.crt:/tls/tls.crt:ro
      - /opt/magenticx/redis/tls/tls.key:/tls/tls.key:ro
      - /opt/magenticx/redis/tls/ca.crt:/tls/ca.crt:ro
    restart: unless-stopped
    networks:
      - backend
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"


  dialogue_bridge: # 8002
    container_name: dialogue_bridge
    healthcheck:
      test: ["CMD", "python", "-c", "import ssl,http.client; ctx=ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT); ctx.check_hostname=False; ctx.verify_mode=ssl.CERT_NONE; c=http.client.HTTPSConnection('127.0.0.1',8002,context=ctx,timeout=5); c.request('GET','/'); c.getresponse()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 45s
    image: konstantinosmpouros/dialogue_bridge:v2.8.1
    entrypoint: ["/bin/sh", "/app/tls/entrypoint-tls.sh"]
    command: ["main:app", "--host", "0.0.0.0", "--port", "8002"]
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:admin@chat_postgres:5432/chat_db?ssl=verify-full
      - VAULT_URL=https://vault:8004
      - AGENTS_SERVICE_URL=https://agents:8003
      - SESSION_TOKEN_SECRET_FILE=/run/secrets/session_token_secret
      - TRUSTED_PROXY_SECRET_FILE=/run/secrets/trusted_proxy_secret
      - REDIS_URL=rediss://redis:6379/0
      - REDIS_PASSWORD_FILE=/run/secrets/redis_password
      - INTERNAL_CA_CERT_PATH=/app/tls/ca.crt
    secrets:
      - session_token_secret
      - trusted_proxy_secret
      - redis_password
    depends_on:
      - agents
      - chat_postgres
      - redis
    restart: unless-stopped
    volumes:
      - /opt/magenticx/dialogue_bridge/tls/entrypoint-tls.sh:/app/tls/entrypoint-tls.sh:ro
      - /opt/magenticx/dialogue_bridge/tls/tls.key:/app/tls/tls.key:ro
      - /opt/magenticx/dialogue_bridge/tls/tls.crt:/app/tls/tls.crt:ro
      - /opt/magenticx/dialogue_bridge/tls/ca.crt:/app/tls/ca.crt:ro
    networks:
      - backend
      - hashicorp_vault
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"


  agentic_ui: # 8050
    container_name: agentic_ui
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:80/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    image: konstantinosmpouros/agentic_ui:v0.9.1
    entrypoint: ["/usr/local/bin/load-secrets-and-exec.sh", "/bin/sh", "/etc/nginx/tls/entrypoint-nginx-tls.sh"]
    command: ["nginx", "-g", "daemon off;"]
    security_opt:
      - no-new-privileges:true
    environment:
      - BFF_BASE_URL=https://dialogue_bridge:8002
    secrets:
      - trusted_proxy_secret
    depends_on:
      - dialogue_bridge
    restart: unless-stopped
    volumes:
      - /opt/magenticx/agentic_ui/tls/entrypoint-nginx-tls.sh:/etc/nginx/tls/entrypoint-nginx-tls.sh:ro
      - /opt/magenticx/agentic_ui/tls/tls.key:/etc/nginx/tls/tls.key:ro
      - /opt/magenticx/agentic_ui/tls/tls.crt:/etc/nginx/tls/tls.crt:ro
      - /opt/magenticx/agentic_ui/tls/ca.crt:/etc/nginx/tls/ca.crt:ro
    networks:
      - backend
      - frontend
      - proxy
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"




networks:
  backend:
    internal: true
  frontend:
  mcp_gateway:
    external: true
  proxy:
    external: true
  hashicorp_vault:
    external: true



secrets:
  openai_api_key:
    external: true
    name: magenticx_openai_api_key
  trusted_proxy_secret:
    external: true
    name: magenticx_trusted_proxy_secret
  session_token_secret:
    external: true
    name: magenticx_session_token_secret
  redis_password:
    external: true
    name: magenticx_redis_password



volumes:
  vectorstore:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/magenticx/vectorstores/chroma_db_openai

  chat_convs:

  agents_filesystem:

  skills_registry_global:

  skills_registry_users:


