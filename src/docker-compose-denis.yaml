services:
  vectordb: # 8000
    image: chromadb/chroma:0.6.3
    container_name: vectordb
    environment:
      - IS_PERSISTENT=TRUE
      - PERSIST_DIRECTORY=/chroma/chroma
      - ANONYMIZED_TELEMETRY=FALSE
    volumes:
      - vectorstore:/chroma/chroma
    restart: unless-stopped
    networks:
      - backend

  rag_service: # 8001
    container_name: rag_service
    image: konstantinosmpouros/rag_service:v1.1.3
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_HOST=vectordb
      - RAG_PORT=8000
    depends_on:
      - vectordb
    restart: unless-stopped
    networks:
      - backend
      - frontend

  agents: # 8003
    container_name: agents
    image: konstantinosmpouros/agents:v1.11.0
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - RAG_HOST=rag_service
      - RAG_PORT=8001
      - MCP_TOOLS_HTTP_URL=http://mcp_gateway:8005/sse
      - DISABLED_AGENT_SLUGS=${DISABLED_AGENT_SLUGS:-}
    depends_on:
      - rag_service
    restart: unless-stopped
    networks:
      - backend
      - frontend
      - mcp_gateway

  chat_postgres: # 5432
    image: postgres:16.3
    container_name: chat_postgres
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chat_db
    volumes:
      - chat_convs:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - backend

  dialogue_bridge: # 8002
    container_name: dialogue_bridge
    image: konstantinosmpouros/dialogue_bridge:v2.4.4
    environment:
      - DATABASE_URL=postgresql+asyncpg://admin:admin@chat_postgres:5432/chat_db
      - VAULT_ADDR=http://vault:8004
      - VAULT_USERPASS_MOUNT=userpass
      - VAULT_OIDC_ROLE=agenticx
    depends_on:
      - agents
      - chat_postgres
    restart: unless-stopped
    networks:
      - backend
      - hashicorp_vault

  agentic_ui: # 8050
    container_name: agentic_ui
    image: konstantinosmpouros/agentic_ui:v0.6.1
    environment:
      - BFF_HOST=dialogue_bridge
      - BFF_PORT=8002
    depends_on:
      - dialogue_bridge
    restart: unless-stopped
    networks:
      - backend
      - frontend
      - proxy




networks:
  backend:
    internal: true
  frontend:
  mcp_gateway:
    external: true
  proxy:
    external: true
  hashicorp_vault:
    external: true



volumes:
  vectorstore:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /home/kostas/vectorstores/chroma_db_openai

  chat_convs:
