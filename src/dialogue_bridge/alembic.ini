# Alembic configuration for dialogue_bridge.
#
# Most settings are kept at their defaults; the database URL is intentionally
# left blank here because env.py loads it from core.settings.settings.database.url
# at runtime. This keeps the secret out of the repo and ensures local + Dennis
# always use whatever DATABASE_URL the container was launched with.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# All ``Create Date:`` timestamps in generated migrations are stamped in UTC
# so files written on dev laptops, CI runners, and Dennis (UTC) all agree.
timezone = UTC
# Sourced from core.settings.settings.database.url at runtime by env.py — kept
# blank here so the DB URL (which carries credentials in some environments)
# never lives in the repo.
sqlalchemy.url =

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
